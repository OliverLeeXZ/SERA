# Shared environment/backbone/optimizer settings; reward schedules live in scripts.
total_train_epochs: 10
total_train_steps: 400
tokenizer_path: ${actor.path}
train_difficulties:
- medium
- hard
- extreme
eval_difficulties:
- easy
- medium
- hard
- extreme
reward_mode: rao
step_credit_enabled: false
depth_aware: true
recursive: false
cluster:
  n_nodes: 2
  n_gpus_per_node: 8
  fileroot: outputs/training
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve
allocation_mode: sglang:d8p1t1+d8p1t1
rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  enable_rollout_tracing: false
gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 3072
  greedy: false
  temperature: 1.0
workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 20
    subagent_max_steps: 20
    max_subagent_depth: 3
    propogate_root_success: false
    skip_subagent_reward_computation: false
    output_dir: ${cluster.fileroot}/rollouts
    verbose: true
    train: true
    timeout: 3600
    step_timeout: 1800
    inference_params:
      temperature: 1.0
      top_p: null
      max_completion_tokens: 3072
      max_prompt_tokens: 10240
  group_size: 8
  leave_one_out_baseline: true
  depth_level_weighting: true
  depth_level_discount_gamma: null
  filter_zero_variance_groups: false
  use_subprocesses: false
loss_fn_config:
  loss_fn: cispo
  clip_low_threshold: 0.0
  clip_high_threshold: 5.0
actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Instruct-2507
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 60000
  optimizer:
    type: adam
    lr: 3.0e-06
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  group_size: ${gconfig.n_samples}
  eps_clip: 0.2
  eps_clip_higher: 0.26
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  behav_imp_weight_cap: null
  dynamic_sampling: false
  reward_norm:
    mean_level: null
    std_level: null
  adv_norm:
    mean_level: null
    std_level: null
  max_new_tokens: ${gconfig.max_new_tokens}
  use_lora: false
ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 60000
  optimizer: null
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 13312
  mem_fraction_static: 0.8
train_dataset:
  batch_size: 8
  type: rl
  path: ''
valid_dataset:
  batch_size: 50
  type: rl
  path: ''
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 50
  freq_secs: null
recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 50
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 50
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
    project: recursive-agents
launcher:
  inference_server_cpus_per_gpu: 7
  inference_server_mem_per_gpu: 32768
  trainer_cpus_per_gpu: 4
  trainer_mem_per_gpu: 32768
environment: textworld
